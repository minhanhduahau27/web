<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Sheet — Interactive Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #16110f;   /* deep charcoal, the darkroom */
    --print:    #ece6da;   /* off-white photographic paper */
    --safelight:#d1452b;   /* darkroom safelight red */
    --amber:    #e0a24a;   /* grease-pencil amber */
    --dim:      #7c736c;   /* muted annotation grey */
    --edge:     #2b2320;   /* frame border */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--ink);
    color:var(--print);
    font-family:"Space Grotesk", system-ui, sans-serif;
    min-height:100vh;
    padding:clamp(20px,5vw,64px);
    /* faint film-grain vignette */
    background-image:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.04), transparent 60%);
  }

  /* ---------- masthead ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1px solid var(--edge);
    padding-bottom:18px;
    margin-bottom:clamp(24px,4vw,44px);
  }
  .brand{ line-height:1; }
  .brand .eyebrow{
    font-family:"Space Mono", monospace;
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--safelight);
    margin-bottom:12px;
  }
  .brand h1{
    font-size:clamp(2rem,6vw,3.6rem);
    font-weight:700;
    letter-spacing:-.03em;
  }
  .stock{
    font-family:"Space Mono", monospace;
    font-size:.72rem;
    color:var(--dim);
    text-align:right;
    line-height:1.7;
  }
  .stock b{ color:var(--amber); font-weight:700; }

  /* ---------- the enlarged print (id="image") ---------- */
  .print-wrap{
    position:relative;
    margin-bottom:clamp(24px,4vw,40px);
  }
  .frame-tag{
    position:absolute;
    top:-9px; left:20px;
    z-index:2;
    background:var(--ink);
    padding:0 12px;
    font-family:"Space Mono", monospace;
    font-size:.7rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--dim);
  }

  #image{
    /* required element the JS updates */
    height:clamp(320px, 52vh, 560px);
    border:1px solid var(--edge);
    border-radius:2px;
    padding:28px;

    display:flex;
    align-items:flex-end;

    /* the resting state before a photo is projected */
    background-color:#0f0b0a;
    background-image:url('');           /* JS swaps this in */
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:"Space Grotesk", sans-serif;
    font-size:clamp(1.1rem,2.4vw,1.6rem);
    font-weight:500;
    color:var(--print);
    letter-spacing:-.01em;
    line-height:1.35;

    /* caption sits on a legibility gradient so it reads over any photo */
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    transition:background-image .15s ease-in-out;
  }
  #image::before{
    /* subtle bottom scrim for caption legibility */
    content:"";
    position:absolute; inset:auto 0 0 0; height:45%;
    border-radius:0 0 2px 2px;
    background:linear-gradient(transparent, rgba(0,0,0,.55));
    pointer-events:none;
  }
  #image span{ position:relative; z-index:1; max-width:38ch; }

  /* ---------- contact-sheet strip ---------- */
  .sheet-label{
    display:flex; align-items:center; gap:14px;
    font-family:"Space Mono", monospace;
    font-size:.72rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:16px;
  }
  .sheet-label::after{
    content:""; flex:1; height:1px; background:var(--edge);
  }

  .sheet{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }

  .cell{
    position:relative;
    border:1px solid var(--edge);
    border-radius:2px;
    overflow:hidden;
    background:#0f0b0a;
    /* sprocket-hole nod: dotted top edge like film perforations */
  }
  .cell::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:9px;
    background:
      radial-gradient(circle at 8px 4px, var(--ink) 2px, transparent 2.5px) 0 0 / 16px 9px repeat-x;
    z-index:2; opacity:.9; pointer-events:none;
  }
  .cell .num{
    position:absolute; top:11px; left:8px; z-index:2;
    font-family:"Space Mono", monospace;
    font-size:.62rem;
    color:var(--amber);
    letter-spacing:.08em;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .cell img{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    filter:grayscale(.35) contrast(1.05);
    transition:filter .2s ease, transform .35s ease;
    cursor:pointer;
  }
  .cell:hover img,
  .cell:focus-within img{
    filter:grayscale(0) contrast(1);
    transform:scale(1.04);
  }
  .cell img:focus-visible{
    outline:2px solid var(--safelight);
    outline-offset:-2px;
  }

  footer{
    margin-top:clamp(28px,5vw,48px);
    padding-top:18px;
    border-top:1px solid var(--edge);
    font-family:"Space Mono", monospace;
    font-size:.68rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .cell:hover img, .cell:focus-within img{ transform:none; }
  }
</style>
</head>

<script>
  /* upDate() runs when the mouse is over (or focus lands on) a thumbnail.
     previewPic is the <img> that was hovered — passed in as "this". */
  function upDate(previewPic) {
    // Step 3.1 — confirm the event fires:
    // console.log("upDate triggered:", previewPic.alt, previewPic.src);

    var display = document.getElementById("image");

    // Project the hovered photo into the big preview box.
    display.style.backgroundImage = "url('" + previewPic.src + "')";

    // Show that photo's caption (its alt text) over the preview.
    display.innerHTML = "<span>" + previewPic.alt + "</span>";
  }

  /* undo() runs when the mouse leaves (or focus leaves) the thumbnail.
     It resets the preview box to its original empty state. */
  function undo() {
    var display = document.getElementById("image");

    // Clear the projected photo.
    display.style.backgroundImage = "url('')";

    // Restore the original prompt text.
    display.innerHTML = "<span>Hover over an image below to display here.</span>";
  }
</script>
</body>
